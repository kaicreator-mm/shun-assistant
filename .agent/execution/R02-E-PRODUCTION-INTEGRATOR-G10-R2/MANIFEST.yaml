design_contract:
  - "Production real-storage Guided DB must use createProductionGuidedService and an explicit external verify-only authority. The HostGuidedService development default is forbidden in production, including temp-root DBs."
  - "The public SPKI pin is loaded only from C:\\ProgramData\\Shun\\authority\\guided-provenance-trust-pin.json, derived from the source-pinned default trust directory. Never read it from environment, CLI, database or receipt data."
  - "Require exact JSON keys schema and spkiSha256; schema is shun.guided.provenance-trust-pin.v1 and spkiSha256 is lowercase 64-hex. Missing, malformed, alias, symlink/reparse and non-regular files refuse before service/listener creation."
  - "Use assessGuidedTrustProtection with pinPath included as a required path so the reviewed G5 ACL owner/DACL policy covers the pin file and source-pinned ProgramData ancestor chain. Reuse the G5 policy; do not duplicate masks."
  - "The runtime inspector supplied to createExternalGuidedProvenanceAuthority must include pinPath in each ACL snapshot; it must throw/fail closed if the probe is unavailable or the exact pinPath row is absent, never return undefined and silently allow the adapter's fallback probe to omit the pin file. G5 still verifies anchor, receipts and ancestors."
  - "Fix the exact operator startup command for Node 24+ in apps/control-api/package.json: use Node's built-in --experimental-transform-types for src/main.ts (no new dependency or lockfile change). Update the main.ts usage comment to match. Do not rely on strip-only node src/main.ts, an ambient/global tsx, or an undeclared transitive loader."
  - "The exact command pnpm --filter @shun/control-api dev must boot under Node 24.21.0 and 26.13.0. The Windows production startup runner must exercise that exact command with real-storage test fixtures, not startViaTsx or a direct node fallback. If the built-in transform flag still fails on the full production import graph, stop and report the next minimal dependency/write-set amendment; do not hide the failure with DEMO mode."
  - "The default DEMO command may be tested separately, but DEMO output or a 503 Guided route is never evidence of production Guided availability."
  - "Copy the reviewed #357 startup-runner test first, then modify only its production-startup case under this parent write set. It must assert truthful startup refusal/no listener when no external operator receipt exists; no DEMO fallback counts as PASS."
  - "Production-startup tests use ephemeral test keys and explicit ACL snapshots in a temporary trust directory. Cover valid signature path, missing/malformed pin, missing anchor/receipt, unsafe ACL and alias refusal."
  - "HostGuidedService catches provenance initialization errors and exposes them as UNKNOWN through decide(); immediately after construction call decide(null), and if it returns UNKNOWN close the service and throw before listener creation. A healthy service returns a side-effect-free REFUSED for this invalid probe input."
  - "If operator trust material is not provisioned, record KEY_NOT_PROVISIONED and keep production startup fail-closed. Do not create new production trust material."
