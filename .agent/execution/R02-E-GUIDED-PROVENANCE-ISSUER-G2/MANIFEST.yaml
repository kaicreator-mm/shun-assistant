design_contract:
  - "Keep runtime adapter verify-only; no private-key import, signing API, key environment variable or secret access in runtime."
  - "Private key must be outside workspace/repository, actual DB directory, selected trust directory, OS temp directory, and ~/.shun; validate canonical path and no reparse aliases before reading."
  - "Reject database/trust path overlap in both directions. Production CLI must always use the fixed default C:\ProgramData\Shun\authority\guided-provenance; trustDir injection remains available only to direct test calls."
  - "ACL inspection must return owner SID and complete DACL access rules for every object in the trust tree, including inherited ACEs; any enumeration/translation/access error or partial scan fails closed."
  - "Require Administrators/SYSTEM ownership; reject any allow ACE for non-privileged principals that grants write data, append, create files/directories, write attributes/extended attributes, delete, delete-child, modify, change permissions or take ownership. Preserve read-only access for the runtime identity; do not require every principal to be denied read."
  - "Apply the same ACL assessment in both runtime verification and operator issuance. The issuer must not report success when the resulting trust tree would be rejected by runtime."
  - "PowerShell traversal must be deterministic, include root + all descendants, use terminating errors, and verify the scanned paths are complete; reparse points must not be silently followed or omitted."
  - "No production private key or receipt in repository, CI, GitHub comments or SQLite."
test_contract:
