  - "No source edit before fresh G2 CAS Claim acceptance; do not reuse G1 claim."
  - "Add positive and negative ACL tests: Administrators/SYSTEM owners with read-only Users/runtime ACEs accepted; Users/Everyone/Authenticated Users write/modify/delete/WRITE_DAC/WRITE_OWNER grants rejected; inherited dangerous ACE rejected; deny ACE and read-only ACE handled correctly; missing/partial/failed PowerShell scan rejected."
  - "Add private-key scope tests for workspace, DB parent, custom trust directory, OS temp and ~/.shun; all must refuse before key read/signing."
  - "Add tests that DB path and trust directory cannot overlap and that production CLI does not accept SHUN_GUIDED_TRUST_DIR."
  - "Run tracked-source syntax preflight, focused tests on Windows Node 24.21.0 and Node 26.13.0, app typecheck/lint, full tools/task-check.sh and exact-SHA Woodpecker Push/PR."
  - "Record exact HEAD/tree/base, three-path diff, Node versions, commands/exit codes, Woodpecker IDs, ACL rule snapshots and private-key scope rejection evidence on Issue #348; never include private key or signed production receipt."
