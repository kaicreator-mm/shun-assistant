finding:
  - "Expired CURRENT step remains CURRENT after a refused late decision; stageTrustedSelection rejects all CURRENT rows, so a new Host observation cannot recover the selected Case."
  - "provisionGuidedCaseFromHostFile returns RESTORED for any currentStep without checking expiry or observation revision."
  - "REFUSE is not restricted to REVIEW_EFFECT; an ASK USER_SUBMIT can be consumed as REFUSED and its answer is not persisted."
  - "Templates advertise BACK/PAUSE/RESUME, but durable state has only CURRENT/CONSUMED and every accepted event is consumed; no actual PAUSE/RESUME transition exists."
