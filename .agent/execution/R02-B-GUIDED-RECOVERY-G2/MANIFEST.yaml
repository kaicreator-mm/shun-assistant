plan:
  - "Add an explicit durable PAUSED state; PAUSE must preserve the current StepSpec, RESUME must restore CURRENT only while the Host observation and StepSpec remain valid."
  - "Define BACK as a non-consuming navigation event for the current one-step Guided form; it must not mint authority or erase submitted answers."
  - "Make ANSWER valid only for ASK/USER_SUBMIT; APPROVE and REFUSE valid only for REVIEW_EFFECT. Reject mismatched decision/kind/event combinations before consuming the step."
  - "When a CURRENT or PAUSED step expires, refuse late decisions and allow a fresh Host observation to replace it only if task/Case identity is preserved, revision advances and observedAt advances. Same/older revision replay remains refused."
  - "Make HostGuidedService.state() hide expired CURRENT/PAUSED steps and make stageTrustedSelection allow only a same-Case, newer-revision, newer-observedAt replacement. The existing provisionGuidedCaseFromHostFile then naturally restages instead of falsely restoring expired state; do not modify composition-guided.ts."
  - "Keep the one-step model, SQLite BEGIN IMMEDIATE/CAS, durable answer digest, restart fence, no auto-grant, no Permit and no Kernel/effect send."
