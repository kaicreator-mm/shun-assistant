design_contract:
  - "Keep runtime adapter verify-only; no private-key import, signing API, key environment variable or secret access in runtime."
  - "Private key must be outside workspace/repository, actual DB directory, selected trust directory, OS temp directory, and ~/.shun; validate canonical path and no reparse aliases before reading."
  - "Reject database/trust path overlap in both directions. Production CLI must always use the fixed default C:\\ProgramData\\Shun\\authority\\guided-provenance; trustDir injection remains available only to direct test calls."
  - "ACL inspection must return owner SID and complete DACL access rules for every object in the trust tree, including inherited ACEs; any enumeration/translation/access error or partial scan fails closed."
  - "Require Administrators/SYSTEM ownership; reject any allow ACE for non-privileged principals that grants write data, append, create files/directories, write attributes/extended attributes, delete, delete-child, modify, change permissions or take ownership; exempt CREATOR OWNER (S-1-3-0) and CREATOR GROUP (S-1-3-1) inheritance placeholders, which never grant direct access. Preserve read-only access for the runtime identity."
  - "Treat any Deny ACE carrying required-read bits (read data/read EA/execute/read attributes) for Everyone, Authenticated Users, Users, INTERACTIVE, LOCAL or CONSOLE_LOGON as breaking runtime read access."
  - "For the baked-in default trust directory only, probe the ancestor chain up to and including C:\\ProgramData (non-recursive) and apply the same ownership/write/deny policy; injected non-default test trust directories are exempt. Ancestor probe failure or coverage gap fails closed."
  - "testOnlyAllowTemporaryKey additionally requires an explicit test-runner context (process.env.VITEST defined); outside it the flag throws a coded error. The OS-temp key relaxation remains impossible for the production CLI."
  - "Apply the same ACL assessment in both runtime verification and operator issuance. The issuer must not report success when the resulting trust tree would be rejected by runtime."
  - "PowerShell traversal must be deterministic, include root + all descendants unless a caller explicitly requests a non-recursive scan of enumerated paths only, use terminating errors, and verify the scanned paths are complete; reparse points must not be silently followed or omitted."
  - "No production private key or receipt in repository, CI, GitHub comments or SQLite."
