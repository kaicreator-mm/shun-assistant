  - "Add positive tests: CREATOR OWNER/CREATOR GROUP placeholder FullControl ACE exempt from the write check; benign Deny ACE for an unrelated SID (S-1-5-99) still accepted; default-trust ancestor chain helper returns the ProgramData chain."
  - "Run tracked-source syntax preflight, focused tests on Windows Node 24.21.0 and Node 26.13.0, app typecheck/lint, full tools/task-check.sh and exact-SHA Woodpecker Push/PR."
  - "Record exact HEAD/tree/base, three-path diff, Node versions, commands/exit codes, Woodpecker IDs, ACL rule snapshots and private-key scope rejection evidence on Issue #348; never include private key or signed production receipt."
