implementation_principles:
  - 'Production default trust root becomes per-interactive-user LocalAppData, never caller/HTTP/LLM/db-selected.'
  - 'Bootstrap is a separate trusted installer/first-run action with explicit user consent, idempotent and restart-stable, not implicit HTTP or runtime minting.'
  - 'Reuse existing Ed25519 signed external provenance, SPKI pin, schema digest and exact canonical DB/path identity; no fake development authority fallback.'
  - 'Private signing key stored outside repo, DB and trust root; no secret/private refs in browser, network or logs.'
  - 'Normal-use runtime remains verify-only and never requires admin; UAC permitted during actual install/first run when OS operation requires, not silently.'
  - 'Elevated different-account token must not bootstrap wrong profile; target interactive user identity verified before any write.'
  - 'Preserve no-reparse path and ancestor checks, per-user OS ACL hygiene and truthful residual same-SID risk; remove incompatible privileged-owner-only ProgramData policy.'
  - 'Do not auto-import/overwrite previous ProgramData trust or mutate protected OS directories.'
  - 'Keep R2, ActionController, currentness/approval checks, replay and selected K unchanged.'
acceptance:
  - 'Fresh per-user first-run setup from a trusted local flow with explicit confirmation; valid same-profile restart reuses unchanged anchor/pin/receipt.'
  - 'No admin required for steady-state Guided run; optional installer/UAC never stores the user trust under a different elevation account.'
  - 'Real Windows Node24 production real-storage startup with valid per-user trust, Guided StepSpec/state and real desktop (no-effect K/executor), plus invalid/missing bootstrap fail-closed.'
  - 'Test missing/partial/corrupt/cross-profile/copied/different DB or schema, double bootstrap, key/anchor mismatch, reparse, legacy ProgramData fallback refusal, replay, UNKNOWN and no auto retry.'
  - 'No actual Windows file effect, paid network/model calls or unapproved ProgramData/ACL/UAC mutation in this test delivery.'
qualification:
  - 'Source preflight syntax Node>=24, Biome, typecheck and impacted tests before Woodpecker; use Woodpecker-only terminal exact-SHA Push and PR checks.'
  - 'Reuse #684/#686 for unaffected paths; reviewer audits full allowed set and current HEAD, fixes in original set if necessary.'
  - 'Publish actual Windows and CI receipts into Issue #404 / PR source; no local-only file-path references as primary evidence.'
  - 'WIP-only source integration after review and CI, then #272 whole-version release qualification (not automatic merge).'
forbidden:
