finding:
  - "P2: decision compatibility tuples remain semantically conflated. REFUSE+ASK+USER_SUBMIT is persisted in guided_step_answers and can be returned by readRecordedAnswer as an ordinary answer; REFUSE+INSPECT+OBSERVATION_RECEIPT is recorded in history as REFUSED despite being a Host receipt. Existing frozen production suites intentionally exercise these legacy tuples."
  - "P2: stageTrustedSelection checks only the immediately stored stepId and enforces freshness only for CURRENT/PAUSED. A previously consumed historical step can be re-staged after a newer step is consumed."
  - "P2: stageTrustedSelection copies prior history to every new Case, including different taskId/caseRef. state() exposes history through the existing Guided route, leaking prior-Case step metadata."
approved_write_set:
  - packages/domain-host/src/guided/host-guided-service.ts
  - tests/integration/v03/r02-b-guided/durable-guided.test.ts
allowed_write_set:
  - packages/domain-host/src/guided/host-guided-service.ts
  - tests/integration/v03/r02-b-guided/durable-guided.test.ts
compatibility_adjudication:
  reason: "The frozen R02-E/R02-V production suites already use the two legacy tuples. Changing their callers is outside this bounded R02-B write set and would create a cross-task handoff. Preserve compatibility, but make the semantics explicit and prevent refused payloads from being read as accepted answers."
  matrix:
    - "ANSWER + ASK + USER_SUBMIT: accepted answer; persist in guided_step_answers."
    - "APPROVE + REVIEW_EFFECT + USER_SUBMIT: accepted non-authorizing approval receipt; no grant or effect."
    - "REFUSE + REVIEW_EFFECT + USER_SUBMIT: refusal; no answer row."
    - "REFUSE + ASK + USER_SUBMIT: legacy terminal refusal; persist a separately typed refusal receipt, never expose it through readRecordedAnswer."
    - "REFUSE + INSPECT + OBSERVATION_RECEIPT: legacy Host receipt compatibility; preserve the tuple but record history status OBSERVATION_RECEIPT, not REFUSED; no user answer, grant or effect."
    - "All other kind/decision/event tuples are refused before consumption."
plan:
  - "Fence historical replay: reject any next.step.stepId already present in stored history, not only a match with the immediately stored step."
  - "For the same task/Case, require a fresh Host observation (different revision token and strictly later observedAtUnixMs) after CONSUMED as well as after expired CURRENT/PAUSED. A new task/Case starts a new history."
  - "Carry history only when taskId and caseRef are identical. Reset history for a genuinely different Case so prior-Case metadata is not returned by state()."
  - "Keep legacy REFUSE+ASK compatibility without treating its payload as an accepted answer: persist it in a separately typed durable refusal record with digest verification; readRecordedAnswer must return undefined for that step and a Host-only refusal readback must preserve the explicit REFUSE outcome."
  - "Keep legacy REFUSE+INSPECT+OBSERVATION_RECEIPT compatibility, but record history as OBSERVATION_RECEIPT rather than REFUSED. Do not imply human approval, grant or effect."
  - "Preserve durable PAUSED state, PAUSE/RESUME across restart, BACK as non-consuming navigation, SQLite BEGIN IMMEDIATE/CAS, restart fence, no auto-grant, no Permit and no Kernel/effect send."
test_contract:
  - "Pack PR must be exactly one manifest path, exact parent source_base_sha/tree, and all pack CI SUCCESS before source edit."
  - "After pack CI, create a fresh Generation-3 CAS Claim bound to this exact pack/source base; G1/G2 are terminal and cannot be reused."
  - "Run exact-tree Windows Node 24.21.0 tracked-source syntax preflight before source-changing CI."
  - "Run r02-b-guided suite, adjacent r02-e-production and r02-v-journeys suites, and full tools/task-check.sh locally; repair failures in the same Builder run."
  - "Add deterministic regression: consume same-Case r01 then r02 and refuse replay of r01 after r02 is consumed; refuse a same-Case stale/older observation even when observedAt is later if its stepId was historically consumed."
  - "Add deterministic regression: stage a different Case after consuming Case A and assert Case B state history is empty."
  - "Add deterministic regression: ASK REFUSE is stored as a refusal receipt, not returned by readRecordedAnswer; INSPECT Host receipt history is OBSERVATION_RECEIPT."
  - "Retain expiry recovery, valid CURRENT restore, PAUSE/RESUME across restart, BACK non-consumption, no grant/effect and answer digest coverage."
  - "Run exact-SHA Woodpecker Push/PR and preserve Node >=24 compatibility."
  - "Controller independently reviews final exact SHA; Builder must not self-approve."
