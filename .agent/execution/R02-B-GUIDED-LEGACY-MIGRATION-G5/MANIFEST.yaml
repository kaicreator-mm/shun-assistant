findings:
  - "P1-01: G4's open-time migration cannot prove a complete replay fence for an existing G3/G4 database. G3 overwrote the single selected-Case row on A->B; prior-Case REVIEW_EFFECT APPROVE/REFUSE and INSPECT receipts have no answer/refusal payload row and their terminal history is irrecoverable. G4 creates guided_consumed_steps before migration and then backfills only answer/refusal rows plus the currently selected Case terminal history. It commits a partial ledger and permits mutations rather than failing closed."
  - "P2-01: answer/refusal conflicts are checked only for the currently selected CONSUMED step. A non-current step present in both payload tables is silently resolved by INSERT OR IGNORE; existing ledger rows are also not cross-checked against matching payload bindings."
  - "P2-02: Builder reports tools/task-check.sh exit 0, but that path and scripts/task-check.sh are absent from the exact G4 source tree. Remote CI is green; local task-check evidence needs an actual reproducible tracked command/path."
