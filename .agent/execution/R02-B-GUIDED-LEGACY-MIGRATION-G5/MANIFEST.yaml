design_contract:
  - "Inspect database schema and data state before creating any G5 ledger/schema marker. Do not infer that a database is fresh merely because a ledger table can be created."
  - "Introduce an explicit durable schema/migration provenance marker, written atomically only after a complete, verifiable initialization. A G3/G4 database without a trusted marker cannot prove that prior-Case terminal history was not discarded."
  - "Fail closed with stable GUIDED_LEDGER_MIGRATION_AMBIGUOUS for every mutation path on any non-empty pre-G5 database whose complete prior-Case replay history cannot be proven. This includes databases with a G4 ledger but no trusted G5 provenance marker: G4 itself could have initialized after G3 had already discarded other-Case REVIEW_EFFECT/INSPECT history. Preserve all existing rows; do not silently reset, delete or claim complete migration."
  - "Only a provably empty database may initialize a new G5 schema marker and ledger automatically. If a safe explicit migration path is available, it must prove complete history from a trusted source and record that provenance; do not invent missing events."
  - "Once a trusted G5 marker exists, validate its schema/version and every existing ledger row before enabling mutations. Keep initialization and marker commit transactional; a partially created table without the marker must remain fail-closed on restart."
  - "Validate conflicts across the complete answer/refusal/ledger datasets before any backfill or commit. Any stepId present in both answer and refusal tables is ambiguous regardless of whether it is the currently selected Case. Verify every matching existing ledger row agrees on taskId, Case identity, template digest, terminal event/decision and timestamp; INSERT OR IGNORE must never silently mask a mismatch."
  - "Preserve G4 global stepId uniqueness, atomic terminal consumption, A->B->A replay fence, service/process restart, REVIEW_EFFECT APPROVE/REFUSE and INSPECT receipt coverage, two-instance exactly-once, BACK non-consumption, PAUSE/RESUME lifecycle, and no ledger exposure through state()/HTTP."
  - "Preserve all G3/G4 payload digest, currentness, expiry recovery, Case isolation, typed ASK refusal, OBSERVATION_RECEIPT, no grant/Permit/Kernel/effect behavior."
test_contract:
  - "Pack PR must be exactly one manifest path on the exact G4 source HEAD/tree; all pack CI checks SUCCESS before source edits."
  - "After pack CI, create a fresh Generation-5 CAS Claim bound to this exact pack HEAD/tree, source base/tree and exact two-path write set. G1-G4 Claims are terminal and cannot be reused."
  - "Legacy G3 database regression: consume a Case-A REVIEW_EFFECT APPROVE or REFUSE / INSPECT receipt, switch to Case B so G3's single selected-case row drops A history, then open with G5. Prove the database fails closed because the complete replay fence is unknowable; all original data remains."
  - "Legacy G4 database regression: non-empty DB with a ledger but no trusted G5 provenance marker fails closed; empty new DB initializes and operates normally; a partial initialization without committed marker remains fail-closed after restart."
  - "Add non-current historical conflict regression: the same stepId in answer and refusal tables must fail closed even when another Case is currently selected."
  - "Add existing-ledger mismatch regressions for taskId, caseRef, template digest, terminal event/decision and timestamp; fail closed without modifying existing data."
  - "Prove marker creation is transactional and idempotent; reopen a marked G5 DB and verify all ledger/payload bindings and row digests."
  - "Retain and rerun all 23 G4 focused tests plus adjacent R02-E production and R02-V journey suites, full tracked R02 typecheck and full CI-equivalent workspace lint/typecheck/test."
