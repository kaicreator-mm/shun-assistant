findings:
  - "P2-01: the G3 replay fence is scoped to the currently selected StoredCase row/history. Switching Case A -> Case B replaces the single guided_selected_case row and drops A history. Returning to A can regenerate the same deterministic stepId while the old observation remains valid; sameCase=false bypasses the consumed freshness check. REVIEW_EFFECT APPROVE/REFUSE and INSPECT OBSERVATION_RECEIPT have no answer/refusal row to provide a second durable fence, so they can be consumed again."
  - "P2-02: G3 records only an exact-tree --experimental-transform-types import of the changed Host service. The frozen pack gate requires tracked-source syntax preflight evidence (exact command, Node version, tracked source set/count and exit code); this evidence is not present in the Builder receipt."
