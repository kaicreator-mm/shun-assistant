design_contract:
  - "Add a durable Host-private consumed-step ledger whose uniqueness fence is independent of the currently selected Case. Bind each row to stepId, taskId, canonical Case identity/digest, template digest, terminal event/decision and consumed timestamp; protect integrity as appropriate."
  - "stageTrustedSelection must check the durable ledger before replacing the selected Case. Any previously consumed stepId is refused with a stable replay code even after A -> B -> A, service restart, or process restart. Do not expose ledger rows or other-Case history through state()/HTTP."
  - "decide must write the consumed-step ledger in the same SQLite BEGIN IMMEDIATE transaction as the terminal outcome receipt and selected-case CAS update. Cover ANSWER, APPROVE, REFUSE (ASK and REVIEW_EFFECT), and REFUSE + INSPECT + OBSERVATION_RECEIPT. Unique conflicts fail closed as STALE/REFUSED; never report RECORDED unless all durable writes commit."
  - "BACK remains non-consuming navigation. PAUSE/RESUME remain lifecycle transitions and do not create a terminal consumed-step ledger row. A later terminal decision consumes the step exactly once."
  - "Preserve current answer/refusal digest receipts, typed refusal semantics, OBSERVATION_RECEIPT history label, PAUSE/RESUME, expiry recovery, same-Case observation freshness, SQLite durability/CAS and zero grant/Permit/Kernel/effect behavior."
  - "Migration must be idempotent and transactional. Backfill all provable consumption evidence from guided_step_answers, guided_step_refusals and the currently persisted selected-Case terminal history. Do not claim that previously discarded other-Case REVIEW_EFFECT/INSPECT history can be reconstructed. If an existing legacy DB cannot prove a complete replay fence, fail closed with an explicit stable migration/unknown code; never silently clear/reset state or imply complete migration."
