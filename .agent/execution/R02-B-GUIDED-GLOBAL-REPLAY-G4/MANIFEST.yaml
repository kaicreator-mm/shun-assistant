  - "Add A -> B -> A regressions with same deterministic Case A step identity, including restart between Case switches. Prove the old A step cannot be staged/consumed again and B state() never exposes A history."
  - "Cover REVIEW_EFFECT APPROVE, REVIEW_EFFECT REFUSE and INSPECT OBSERVATION_RECEIPT replay after A -> B -> A; include durable restart/readback and zero grant/effect assertions."
  - "Cover ASK ANSWER and ASK REFUSE ledger insertion, idempotent migration/backfill, unique conflict/concurrent consumption, and BACK/PAUSE/RESUME non-consumption."
  - "Add a legacy-DB migration regression proving known records are backfilled and ambiguous prior-Case history is not falsely treated as complete; fail closed without data deletion."
  - "Retain all G3 regressions: same-Case historical-step replay, observation freshness, Case projection isolation, typed ASK refusal receipt, INSPECT observation receipt, expiry recovery, pause/resume and restart."
