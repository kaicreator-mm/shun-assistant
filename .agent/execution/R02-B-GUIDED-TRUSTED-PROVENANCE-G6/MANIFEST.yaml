design_contract:
  - "Replace the self-asserted same-database marker digest with an injected GuidedProvenanceAuthority contract. The authority must be external to the SQLite DB and cannot derive its trust from marker contents, an environment variable, or a key stored beside/in the DB."
  - "The authority receipt must bind the exact Guided schema version, canonical DDL/schema digest, canonical database identity/path and an authority-issued database identifier. The authority must persist/verify an external receipt or equivalent protected trust record so a marker copied to another DB cannot be accepted."
  - "No fallback to an unkeyed hash, a key stored in SQLite, a sidecar secret writable alongside the DB, or a self-signed marker. If the authority is absent or cannot verify, every mutation path fails closed with a stable UNKNOWN/REFUSED code."
  - "The domain-host service exposes the authority contract and requires it for fresh initialization and marked reopen. This R02-B pack does not edit main.ts or composition; R02-E (#269) owns production adapter wiring in its existing composition/main write set. Until R02-E injects a real authority, production Guided initialization must fail closed rather than silently use a test or local key."
  - "Bump the Guided schema generation. Any non-empty G3/G4/G5 database without a verifiable external receipt fails closed and preserves every row. Do not automatically bless or backfill a G5 DB whose marker is self-asserted."
  - "Validate the exact schema definition on open: expected tables, columns, types, nullability, primary keys, CHECK constraints and indexes/DDL digest; bind the schema digest/version into the external receipt."
  - "Parse and strictly validate every persisted Answer and Refusal envelope on open and on Host readback. Bind embedded schema, journey/task/step identity, Case identity, event/source, decision, template digest where represented, answer payload, evidence refs and occurredAt timestamp to the indexed row and consumed-step ledger. Digest equality alone is not sufficient."
  - "Persist StepKind (ASK/REVIEW_EFFECT/INSPECT) and receipt kind in the consumed-step ledger. Enforce exact payload cardinality: ASK ANSWER requires one Answer receipt; ASK REFUSE requires one Refusal receipt; REVIEW_EFFECT APPROVE/REFUSE requires no Answer/Refusal payload; INSPECT OBSERVATION_RECEIPT requires neither. Missing ASK refusal evidence is ambiguous and fails closed."
  - "Recheck database table/marker state only after acquiring BEGIN IMMEDIATE. Concurrent first openers must serialize; the second opener must re-read and validate the first opener's committed schema instead of attempting duplicate CREATE TABLE."
  - "Keep the R02-B boundary: no HTTP route/server.ts, main.ts, UI, composition, Domain Computer, Kernel, sender, grant, Permit or effect-dispatcher edits in this pack."
  - "Do not add a production signing key or secret to the repository, source tree, SQLite file, tests artifact or issue evidence. Tests may use an explicitly test-only authority whose secret stays outside the DB."
test_contract:
  - "Pack PR must contain exactly this one manifest path, parented to exact source_base_sha 91463f709f7401d92e7902e43d92b9471063efdd and source_base_tree 82008b935cd4a9b90b4dc1730faab723b389d6bc. All pack CI checks must be SUCCESS before source edits."
  - "After pack CI, create a fresh Generation-6 DISPATCH_CLAIMED event on Issue #263 bound to this exact pack HEAD/tree, source base/tree, operator/session/dispatch identity and exact three-path write set. G1-G5 Claims are terminal and cannot be reused."
  - "Forged-marker regression: create a non-empty legacy G4 DB, add a marker table/row with the exact public G5 SHA-256 formula, and prove the external authority rejects it and all rows remain unchanged."
  - "Copied-receipt regression: copy a valid marker/receipt from a different DB identity/path into a legacy DB and prove verification fails closed."
  - "Schema-tamper regression: change a column, CHECK constraint, index or DDL while retaining/copying a receipt; open must fail closed."
  - "Answer payload tamper regression: alter embedded stepId/taskId/Case/event/source/occurredAt (and template binding envelope where applicable), recompute the unkeyed payload digest, and prove open/readback rejects it without modifying data."
  - "Refusal payload tamper regression: alter embedded stepId/taskId/Case/templateDigest/decision/nested outcome/timestamp, recompute the digest, and prove open/readback rejects it."
  - "ASK refusal cardinality regression: delete the refusal payload but retain the ledger/history; fail closed. REVIEW_EFFECT REFUSE without payload and INSPECT OBSERVATION_RECEIPT without payload remain valid only when StepKind/receipt-kind ledger evidence proves them."
  - "G3 lost-history regression: Case A consumes REVIEW_EFFECT APPROVE or REFUSE and/or INSPECT OBSERVATION_RECEIPT, Case B replaces the single selected-Case row, then a G6 open without a valid external receipt fails closed and preserves the complete original DB."
  - "Concurrent first-open regression: two service instances/processes race to initialize one empty DB; both must converge to a valid schema or one returns a bounded explicit failure without leaving a partial/ambiguous DB. No false unavailable state after another opener commits."
  - "Retain all G4/G5 replay, restart, currentness, expiry, pause/resume, navigation, atomic consumption and concurrency coverage; add schema-version migration/legacy G5 fail-closed coverage."
  - "Run tracked-source JS/TS syntax preflight before CI; record exact Node version, exact driver SHA-256, argv, tracked-source glob/count, exit code and output digest."
  - "Run Windows Node 24.21.0 and 26.13.0 focused Guided tests, adjacent R02-E/R02-V suites, full tracked lint/typecheck/test and exact-SHA Woodpecker Push/PR plus GitHub Actions contracts/executor-windows."
  - "Controller performs a fresh independent Exact-SHA R2; Builder must not self-approve."
