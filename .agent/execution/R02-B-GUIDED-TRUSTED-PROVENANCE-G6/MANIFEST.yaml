findings:
  - "P1-01: G5 marker is a public deterministic SHA-256 over schema_version and initialized_at, stored in the same SQLite DB. A legacy G4 database can mint/copy the marker and appear G5. The validator checks table names, not exact DDL/constraints/indexes. The prior-Case history-loss fail-closed boundary is therefore not backed by trusted provenance."
  - "P1-02: G5 validates only outcome_json/refusal_json SHA-256. It does not parse the JSON and bind embedded identity/event/decision/time fields to the indexed columns and ledger. A recomputed payload digest can conceal mismatched embedded content; Host readback returns the payload."
  - "P2-01: A CONSUMED ASK step with last.status REFUSED and a missing refusal payload is classified as REVIEW_EFFECT REFUSE. The ledger does not retain StepKind, so historical ASK refusal loss cannot be distinguished."
  - "P2-02: The G5 G3 legacy regression uses ASK answers in Cases A/B, not the exact lost-history scenario of Case-A REVIEW_EFFECT APPROVE/REFUSE or INSPECT receipt followed by Case B replacing the single selected-Case row."
  - "P2-03: #initializeOrValidate reads the empty table set before BEGIN IMMEDIATE. Two concurrent first openers can both observe empty; the second waits, then plain CREATE TABLE fails and that opener becomes unavailable."
